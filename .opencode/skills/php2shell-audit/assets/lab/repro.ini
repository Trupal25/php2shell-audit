; Lab-only PHP configuration for the request-parsing reproduction.
;
; The low memory_limit keeps the multipart request small enough to run on a
; laptop. The raised input limits let the parser, rather than an unrelated
; post-size cap, decide when memory is exhausted. This is not a production
; configuration and it is not a hardening recommendation.
memory_limit = 8M
post_max_size = 1G
upload_max_filesize = 1G
max_input_vars = 10000000
max_file_uploads = 1000000
max_multipart_body_parts = 10000000
max_input_time = -1
max_execution_time = 0
display_errors = On
log_errors = On
error_reporting = E_ALL
html_errors = 0
expose_php = On

; The session upload-progress path is part of the advisory's early-consumer
; surface. Keep it enabled so the probe exercises that initialization path.
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 0
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 1
session.save_path = /tmp
session.use_strict_mode = 0
