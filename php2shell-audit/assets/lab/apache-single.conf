# Lab-only Apache configuration for deterministic heap reuse during the
# opt-in RCE validation module. One prefork worker, no keep-alive.
#
# Mounted at /etc/apache2/conf-enabled/zz-p2s.conf:ro, after mods-enabled, so
# these values override the image defaults.
KeepAlive Off
ServerName localhost
ServerTokens Prod
ServerSignature Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
